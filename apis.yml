aid: carma
name: Carma
description: 'Carma is an Australian online used-car retailer that lets consumers buy, sell,
  and trade in pre-owned vehicles entirely online. Every car is inspected and reconditioned,
  and the platform bundles financing through partner lenders, home delivery, trade-in
  valuations, a 7-day money-back guarantee, a 3-month warranty, and NRMA roadside assistance
  as an alternative to the traditional dealership experience. Backed by General Catalyst
  since 2022, Carma is headquartered in Sydney, Australia. This API Evangelist profile was
  surfaced as a General Catalyst portfolio company and enriched from Carma''s public web
  surface; Carma publishes no public developer API at this time.'
